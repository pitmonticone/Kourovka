fidelity:
  divergences: >
    `Challenge.lean` contains one deliberate `sorry`, standing for the proof supplied by the
    Solution module. `comparator.json` declares no `definition_names`, so nothing in the statement
    is left for the solution to instantiate. The compared theorem depends on exactly `propext`,
    `Classical.choice` and `Quot.sound`; the wider axiom list in the repository-root record exists
    only because `kourovka_21_8` and `kourovka_21_150` use `native_decide`, and neither of those
    is in the axiom closure of `kourovka_18_50`.

    Two presentational differences between the formal statement and the informal account, neither
    of which changes the claim. Indices run from `0` in Lean and from `1` in the paper, including
    inside the cocycle, where the paper's coefficient `(j-1)!` with `j` from `1` is the Lean `j !`
    with `j : Fin n` from `0`. The formal statement also supplies a `DecidableEq` instance for the
    witness group, which is what lets the set of permuted products be formed as a `Finset` image;
    it is produced with the witness rather than assumed of an arbitrary group, so it is not a
    hypothesis on the problem.

    The informal proof in the companion paper sorts words by swapping adjacent inverted pairs. The
    Lean proof does not: it computes the central coordinate of a permuted product as a sum of
    pairwise cocycle values (`list_prod_cent_zero`), identifies that sum with the factorial rank
    (`pairwiseB_eq_factRank`), and counts the image (`products_card`). No commutator is formed
    anywhere. The two arguments agree; this paragraph describes the formalized one.

review:
  status: "author-verified"
  reviewers: ["Wouter van Doorn", "Elias Judin", "Pietro Monticone", "Daniel Morrison"]
  notes: >
    The four authors reviewed the formalization. No further independent human review of the Lean
    formalisation was performed.

    Separately, and of the informal solution rather than the Lean, this result was reviewed
    through the Kourovka Notebook: the editors accepted it into issue 21, and the problem's
    proposer, Stefan Kohl, has publicly recorded and accepted the construction on his own
    MathOverflow thread. That is review of the mathematics, not of the formalization.

alignment:
  namespace: "_root_"
  statements:
