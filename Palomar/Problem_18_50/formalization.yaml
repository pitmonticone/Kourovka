# formalization.yaml (v0.4): the per-result record for the Palomar submission of
# `kourovka_18_50`. The repository-level record, covering all nine results, is the
# `formalization.yaml` at the repository root.

version: "v0.4"

project:
  name: "Kourovka Notebook Problem 18.50"
  authors: ["Wouter van Doorn", "Elias Judin", "Pietro Monticone", "Daniel Morrison"]
  responsible_maintainers: ["Pietro Monticone"]
  license: "Apache-2.0"
  repository: "https://github.com/pitmonticone/Kourovka"
  lean_version: "v4.28.0"
  mathlib_revision: "8f9d9cff6bd728b17a24e163c9402775d9e6a365"
  short_description: >
    For every `n` and every `k` with `1 ≤ k ≤ n!`, a group with `n` pairwise distinct elements
    whose `n!` permuted products take exactly `k` distinct values. Discovered and formalized in
    Lean by Aristotle, a formal reasoning agent developed by Harmonic.

# classification - the mathematics of this result, not the use of Lean.
classification:
  arxiv: ["math.GR", "math.CO"]
  msc2020: ["20E22", "05A05", "20F18"]

sources:
  - title: "Permuted product sets of prescribed cardinality (solution to Kourovka Notebook Problem 18.50)"
    authors: ["Wouter van Doorn", "Elias Judin", "Pietro Monticone", "Daniel Morrison"]
    id: "arXiv:2607.17477"
    type: "original-proof"
    location: "Section 3"
    relationship: "other"
    note: >
      The result compared by `comparator.json` as `kourovka_18_50`. The title above names the
      result; the citable informal presentation is Section 3 of "On Some Problems from the
      Kourovka Notebook", arXiv:2607.17477 version 2, 26 July 2026.

      It is first presented by this work: Aristotle produced the construction and the Lean proof,
      and the informal account was written from that proof rather than the other way round.
      The Kourovka Notebook listed the problem as open until this solution was accepted into issue
      21, and that its proposer accepted the construction on his own MathOverflow thread.
  - title: "Unsolved Problems in Group Theory. The Kourovka Notebook"
    authors: ["Evgeny I. Khukhro", "Victor D. Mazurov"]
    id: "arXiv:1401.0300v45"
    type: "paper"
    location: "Problem 18.50"
    relationship: "other"
    license: "arXiv.org perpetual, non-exclusive license 1.0"
    author_endorsement: "endorsed"
    note: >
      Problem 18.50 was proposed by Stefan Kohl. Khukhro and Mazurov are the editors of the
      collection, not the author of the problem nor authors of its solution; v0.4 has no
      `editors` field, so they appear under `authors`.

      The relationship is `other` rather than `background` because version 45 does more than
      supply context: it both poses the problem and records the accepted solution. The closed
      vocabulary has no category for a source that poses the problem a result answers.

      `author_endorsement` records the editors accepting this solution into issue 21. What a
      reader can check is the version 45 entry and the solution note in the Notebook's preprint
      repository; the correspondence itself is private and cannot be independently confirmed.
  - title: "Numbers of distinct products obtained by permuting the factors"
    authors: ["Stefan Kohl"]
    id: "https://mathoverflow.net/q/123890"
    type: "web discussion"
    location: "answer 511354"
    relationship: "other"
    author_endorsement: "endorsed"
    note: >
      Where Kohl, the proposer of Problem 18.50, first raised the question, on 7 March 2013. He
      reported confirming it computationally for small `n` and later noted that it would appear
      in the eighteenth issue of the Notebook.

      On 16 May 2026 Kohl posted the construction formalized here as answer 511354 and accepted
      it on his own question, opening "The answer is affirmative, as reported by Pietro Monticone
      on May 16, 2026" with a pointer to the Notebook's preprint repository.
  - title: "Kourovka Notebook Problem 18.50"
    authors: ["Pietro Monticone"]
    id: "https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/05/18_50.pdf"
    type: "paper"
    relationship: "other"
    note: >
      The informal solution note submitted to the Kourovka Notebook on 16 May 2026 and published
      in its preprint repository. This is the authors' own write-up of the present result, made
      from the Lean proof.

