      lean: "kourovka_18_50"
      module: "Kourovka.Problem_18_50"
      status: "proved"
      note: >
        Stated for audit in `Challenge.lean` using Mathlib alone, and compared by
        `comparator.json` against the proof in `Kourovka.Problem_18_50`.

acknowledgements: >
